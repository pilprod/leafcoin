<svg xmlns="http://www.w3.org/2000/svg" width="800" height="466" viewBox="0 0 800 466" role="img" aria-labelledby="title description">
<title id="title">Follow the nutrient-delivery loop</title><desc id="description">Nutrient solution leaves the reservoir, passes through a pump and filter, reaches nozzles and suspended roots, then drains back to the reservoir. The physical delivery path and return path both need attention.</desc>
<style>
:root { --bg:#f5faf7; --card:#e9f3ed; --ink:#12201a; --muted:#486054;
  --line:#b8cfc0; --accent:#146442; --water:#298b97; --root:#8c744f; }
@media (prefers-color-scheme:dark) { :root { --bg:#081411; --card:#10271d;
  --ink:#effcf3; --muted:#bed2c6; --line:#315b43; --accent:#9deb8f;
  --water:#75cbd0; --root:#dcc9a4; } }
text { font-family:Arial,sans-serif; fill:var(--ink); }
.label { font-size:21px; font-weight:600; }
.body { font-size:17px; fill:var(--muted); }
.small { font-size:16px; fill:var(--muted); }
.card { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
.arrow { fill:none; stroke:var(--accent); stroke-width:2.5; }
.return { stroke-dasharray:5 6; }
.wire { fill:none; stroke:var(--muted); stroke-width:2.5; }
.roots { fill:none; stroke:var(--root); stroke-width:2; }
.water { fill:var(--water); fill-opacity:.14; stroke:var(--water); stroke-width:2; }
.leaf { fill:var(--accent); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--accent)"/></marker></defs>
<rect width="800" height="466" rx="16" fill="var(--bg)"/><rect class="card" x="24" y="20" width="334" height="148" rx="12"/><circle cx="52" cy="48" r="12" fill="var(--accent)"/><text x="52" y="53" text-anchor="middle" fill="var(--bg)" style="fill:var(--bg);font-size:14px;font-weight:700">1</text><text class="label" x="42" y="90">Nutrient reservoir</text><text class="body" x="42" y="127">Water and dissolved</text><text class="body" x="42" y="149">mineral nutrients</text><path class="arrow" marker-end="url(#arrow)" d="M365 94.0 H433"/><rect class="card" x="442" y="20" width="334" height="148" rx="12"/><circle cx="470" cy="48" r="12" fill="var(--accent)"/><text x="470" y="53" text-anchor="middle" fill="var(--bg)" style="fill:var(--bg);font-size:14px;font-weight:700">2</text><text class="label" x="460" y="90">Pump and filter</text><text class="body" x="460" y="127">Move solution through</text><text class="body" x="460" y="149">a maintained supply path</text><path class="arrow" marker-end="url(#arrow)" d="M609.0 176 V215"/><rect class="card" x="442" y="225" width="334" height="148" rx="12"/><circle cx="470" cy="253" r="12" fill="var(--accent)"/><text x="470" y="258" text-anchor="middle" fill="var(--bg)" style="fill:var(--bg);font-size:14px;font-weight:700">3</text><text class="label" x="460" y="295">Nozzles and roots</text><text class="body" x="460" y="332">Spray wets roots</text><text class="body" x="460" y="354">suspended in air</text><path class="arrow" marker-end="url(#arrow)" d="M435 299.0 H367"/><rect class="card" x="24" y="225" width="334" height="148" rx="12"/><circle cx="52" cy="253" r="12" fill="var(--accent)"/><text x="52" y="258" text-anchor="middle" fill="var(--bg)" style="fill:var(--bg);font-size:14px;font-weight:700">4</text><text class="label" x="42" y="295">Drain and return</text><text class="body" x="42" y="332">Unused solution returns</text><text class="body" x="42" y="354">to the reservoir</text><path class="arrow return" marker-end="url(#arrow)" d="M191.0 216 V178"/><text class="small" x="24" y="411">Recirculating example: delivery and drainage must both work.</text></svg>
