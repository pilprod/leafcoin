<svg xmlns="http://www.w3.org/2000/svg" width="800" height="466" viewBox="0 0 800 466" role="img" aria-labelledby="title description">
<title id="title">Learn from repeated growing trials</title><desc id="description">Define a crop and baseline, observe consistent measurements, compare repeated controlled trials, evaluate a model using separate data, and have an operator review a bounded adjustment before testing again. This describes proposed Leafcoin research, not a deployed optimization system.</desc>
<style>
:root { --bg:#f5faf7; --card:#e9f3ed; --ink:#12201a; --muted:#486054;
  --line:#b8cfc0; --accent:#146442; --water:#298b97; --root:#8c744f; }
@media (prefers-color-scheme:dark) { :root { --bg:#081411; --card:#10271d;
  --ink:#effcf3; --muted:#bed2c6; --line:#315b43; --accent:#9deb8f;
  --water:#75cbd0; --root:#dcc9a4; } }
text { font-family:Arial,sans-serif; fill:var(--ink); }
.label { font-size:21px; font-weight:600; }
.body { font-size:17px; fill:var(--muted); }
.small { font-size:16px; fill:var(--muted); }
.card { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
.arrow { fill:none; stroke:var(--accent); stroke-width:2.5; }
.return { stroke-dasharray:5 6; }
.wire { fill:none; stroke:var(--muted); stroke-width:2.5; }
.roots { fill:none; stroke:var(--root); stroke-width:2; }
.water { fill:var(--water); fill-opacity:.14; stroke:var(--water); stroke-width:2; }
.leaf { fill:var(--accent); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--accent)"/></marker></defs>
<rect width="800" height="466" rx="16" fill="var(--bg)"/><rect class="card" x="20" y="20" width="234" height="148" rx="12"/><circle cx="48" cy="48" r="12" fill="var(--accent)"/><text x="48" y="53" text-anchor="middle" fill="var(--bg)" style="fill:var(--bg);font-size:14px;font-weight:700">1</text><text class="label" x="38" y="90">Define a baseline</text><text class="body" x="38" y="127">Crop, outcomes and</text><text class="body" x="38" y="149">operating bounds</text><path class="arrow" marker-end="url(#arrow)" d="M261 94.0 H274"/><rect class="card" x="283" y="20" width="234" height="148" rx="12"/><circle cx="311" cy="48" r="12" fill="var(--accent)"/><text x="311" y="53" text-anchor="middle" fill="var(--bg)" style="fill:var(--bg);font-size:14px;font-weight:700">2</text><text class="label" x="301" y="90">Observe consistently</text><text class="body" x="301" y="127">Measurements plus</text><text class="body" x="301" y="149">maintenance records</text><path class="arrow" marker-end="url(#arrow)" d="M524 94.0 H537"/><rect class="card" x="546" y="20" width="234" height="148" rx="12"/><circle cx="574" cy="48" r="12" fill="var(--accent)"/><text x="574" y="53" text-anchor="middle" fill="var(--bg)" style="fill:var(--bg);font-size:14px;font-weight:700">3</text><text class="label" x="564" y="90">Compare trials</text><text class="body" x="564" y="127">Controlled changes</text><text class="body" x="564" y="149">across repeated cycles</text><path class="arrow" marker-end="url(#arrow)" d="M663.0 176 V215"/><rect class="card" x="546" y="225" width="234" height="148" rx="12"/><circle cx="574" cy="253" r="12" fill="var(--accent)"/><text x="574" y="258" text-anchor="middle" fill="var(--bg)" style="fill:var(--bg);font-size:14px;font-weight:700">4</text><text class="label" x="564" y="295">Evaluate a model</text><text class="body" x="564" y="332">Separate evaluation data</text><text class="body" x="564" y="354">and a simple baseline</text><path class="arrow" marker-end="url(#arrow)" d="M539 299.0 H526"/><rect class="card" x="283" y="225" width="234" height="148" rx="12"/><circle cx="311" cy="253" r="12" fill="var(--accent)"/><text x="311" y="258" text-anchor="middle" fill="var(--bg)" style="fill:var(--bg);font-size:14px;font-weight:700">5</text><text class="label" x="301" y="295">Operator review</text><text class="body" x="301" y="332">Bound the adjustment</text><text class="body" x="301" y="354">and test the next cycle</text><path class="arrow return" marker-end="url(#arrow)" d="M275 300 H10 V94 H14"/><text class="small" x="24" y="411">Repeat comparable trials. Protective control stays local and deterministic.</text></svg>
