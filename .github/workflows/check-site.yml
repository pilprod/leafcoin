name: Check Leafcoin site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate HTML, local resources and discovery metadata
        run: python3 scripts/check_site.py
      - name: Validate regional analytics and visitor choices
        run: node scripts/check_analytics.cjs
